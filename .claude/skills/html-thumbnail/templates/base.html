<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#0f172a; --bg2:#1e3a8a; --accent:#facc15; --text:#ffffff; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family:'Be Vietnam Pro', 'Noto Sans', Arial, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text); position:relative;
  }
  /* Max ~4 words of headline, readable at phone-thumbnail size */
  .headline { position:absolute; left:60px; top:90px; width:860px;
    font-size:128px; font-weight:900; line-height:1.02; text-transform:uppercase;
    text-shadow:0 6px 0 rgba(0,0,0,.35); }
  .headline em { color:var(--accent); font-style:normal; }
  .sub { position:absolute; left:60px; bottom:70px; font-size:48px; font-weight:800;
    background:var(--accent); color:#111; padding:10px 28px; border-radius:12px; }
  /* Optional: <img class="hero" src="path/to/character.png"> */
  .hero { position:absolute; right:0; bottom:0; height:92%; }
</style>
</head>
<body>
  <div class="headline">Nói <em>tiếng Anh</em> tự tin</div>
  <div class="sub">Học trong 7 ngày</div>
</body>
</html>
