<!-- CẢNH 1 (0.0s - 6.0s). Mọi thứ nằm TRONG <template>; thời gian data-start/data-duration là GIÂY, TÍNH TỪ ĐẦU CẢNH này (không phải từ đầu video). -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #root .char { position: absolute; bottom: 90px; width: 420px; }
    #root .cap { position: absolute; left: 160px; right: 160px; bottom: 60px; padding: 18px 28px; border-radius: 14px;
                 background: rgba(0, 0, 0, .62); color: #fff; font: 600 44px/1.3 "Inter", sans-serif; text-align: center; }
    #root .who { margin-right: 14px; font-weight: 900; }
    #root .who.an { color: #ff9b73; }
    #root .who.minh { color: #7fd3ff; }
  </style>

  <div id="root" data-composition-id="scene1" data-width="1920" data-height="1080">
    <!-- id duy nhất trên cả trang: tiền tố s1- -->
    <img id="s1-bg" class="clip bg" src="assets/bg_cafe.svg" data-start="0" data-duration="6">
    <img id="s1-an" class="clip char" src="assets/char_an.svg" style="left: 300px" data-start="0" data-duration="6">
    <img id="s1-minh" class="clip char" src="assets/char_minh.svg" style="right: 300px" data-start="0" data-duration="6">

    <!-- Phụ đề: mỗi lời thoại một phần tử, thời gian lấy từ script.srt trừ đi giờ bắt đầu của cảnh (0.0s) -->
    <div id="s1-c1" class="clip cap" data-start="0" data-duration="3"><span class="who an">An</span>Chào Minh, hôm nay mình quay một video nhỏ.</div>
    <div id="s1-c2" class="clip cap" data-start="3" data-duration="3"><span class="who minh">Minh</span>Ừ, có nhân vật, có bối cảnh, và giọng nói riêng.</div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Trong file cảnh dùng fromTo (không dùng from) vì host seek lại mỗi lần cảnh hiện.
    tl.fromTo("#s1-bg", { scale: 1 }, { scale: 1.08, duration: 6, ease: "none" }, 0);          // máy quay đẩy chậm
    tl.fromTo("#s1-an", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.1);
    tl.fromTo("#s1-minh", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.3);
    // Nhân vật đang nói nhún nhẹ để người xem biết ai nói
    tl.fromTo("#s1-an", { y: 0 }, { y: -18, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.2);
    tl.fromTo("#s1-minh", { y: 0 }, { y: -18, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.2);
    tl.fromTo("#s1-c1", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0);
    tl.fromTo("#s1-c2", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3);
    window.__timelines["scene1"] = tl;   // khóa = id host = data-composition-id
  </script>
</template>
