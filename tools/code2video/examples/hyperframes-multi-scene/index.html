<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Demo nhiều cảnh, nhiều nhân vật</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111; }
  </style>
</head>
<body>
  <!-- ROOT: data-duration = tổng thời lượng video (giây) = giây kết thúc câu cuối + 0.5 (app thêm 0.5s lặng cuối voiceover).
       Mốc cuối script.srt là 19.0s nên root = 19.5. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="19.5" data-width="1920" data-height="1080">

    <!-- Giọng đọc: app tự tạo voiceover.wav từ script.srt, file HTML chỉ cần gắn vào. BẮT BUỘC có id. -->
    <audio id="voice" src="voiceover.wav" data-start="0" data-duration="19.5" data-track-index="0"></audio>

    <!-- Mỗi CẢNH là một file con. Host, id gốc của file con và khóa window.__timelines phải CÙNG một id (scene1...). -->
    <div id="scene1" data-composition-id="scene1" data-composition-src="compositions/scene_1.html"
         data-start="0" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
    <div id="scene2" data-composition-id="scene2" data-composition-src="compositions/scene_2.html"
         data-start="6" data-duration="8.5" data-track-index="1" data-width="1920" data-height="1080"></div>
    <div id="scene3" data-composition-id="scene3" data-composition-src="compositions/scene_3.html"
         data-start="14.5" data-duration="5" data-track-index="1" data-width="1920" data-height="1080"></div>
  </div>

  <script>
    // Timeline gốc: rỗng cũng được (các cảnh con tự có timeline riêng). Phải paused và đăng ký đúng id root.
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
