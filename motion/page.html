<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Patrick Hand"; src: url("/m/fonts/PatrickHand-Regular.ttf"); }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: var(--w); height: var(--h); }
#out { position: absolute; left: 0; top: 0; }
#overlay { position: absolute; inset: 0; }
</style></head>
<body><div id="stage"><canvas id="out"></canvas><div id="overlay"></div></div>
<script>const q = new URLSearchParams(location.search); const [w, h] = (q.get('size') || '1920x1080').split('x');
document.documentElement.style.setProperty('--w', w + 'px'); document.documentElement.style.setProperty('--h', h + 'px');</script>
<script src="/m/dist/engine.js"></script>
</body></html>
