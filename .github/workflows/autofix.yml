name: Auto-fix

# When "Build runner image" or "Night job" fails on main, Claude reads the failure log and tries a minimal fix.
# Authorized by the repo owner. Safeguards: max 3 autofix commits per 24 h, only the files listed below,
# never secrets or workflow files (GITHUB_TOKEN cannot push .github/workflows anyway), and no changes for
# billing / usage-limit / auth problems. Disable by deleting this file or turning the workflow off in the Actions tab.
on:
  workflow_run:
    workflows: ["Build runner image", "Night job"]
    types: [completed]

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_RUN: ${{ github.event.workflow_run.id }}
      FAILED_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attempt budget (max 3 per 24 h)
        id: budget
        run: |
          n=$(git log origin/main --since="24 hours ago" --grep='^autofix:' --oneline | wc -l)
          echo "Autofix commits in the last 24 h: $n"
          if [ "$n" -ge 3 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch failure log
        if: steps.budget.outputs.go == 'true'
        run: |
          gh run view "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 300 > "$RUNNER_TEMP/failed.log" || true
          wc -l "$RUNNER_TEMP/failed.log"
      - name: Claude fixes it
        if: steps.budget.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The workflow "${{ github.event.workflow_run.name }}" (run ${{ github.event.workflow_run.id }}) failed on main.
            The tail of its failure log is in ${{ runner.temp }}/failed.log. Read it first.
            1. Find the root cause. If it is NOT fixable by changing files (billing or spending limit, usage / rate limit, 401 or other auth or
               token problem, GitHub outage, network flake, empty log), make NO changes and stop.
            2. Otherwise make the smallest fix. You may edit ONLY: Dockerfile, .dockerignore, requirements.txt, scripts/, tools/code2video/,
               .claude/skills/, templates/, tasks/README.md. Never edit .github/ (including this file), secrets, or tasks/pending files.
            3. Check what you can locally (python -m py_compile, YAML/JSON parse, pytest for tools/code2video if you touched it).
            4. Commit with a message that starts with `autofix:` and push to main. One focused commit. If you cannot fix it, push nothing.
            5. Never print secrets. Do not rerun anything yourself.
          claude_args: --max-turns 40 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Rebuild the image if the fix touched it
        if: steps.budget.outputs.go == 'true' && env.FAILED_NAME == 'Build runner image'
        run: |
          git fetch origin main -q
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            gh workflow run build-image.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Fix pushed: image rebuild started"
          else
            echo "No fix was pushed"
          fi
