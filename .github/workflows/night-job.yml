name: Night job

# Starts 00:00 Asia/Ho_Chi_Minh (UTC+7) = 17:00 UTC, once per night. GitHub often delays cron, so the
# deadline step below works from the real clock: a late start just gets less time, never a run past 06:00. The whole job ends by 06:00 ICT (job timeout 360 min).
# The Claude step is stopped at 05:45 ICT (22:45 UTC) so the last 15 min are left to save work and upload logs. If Claude runs out of usage (rate limit)
# the step ends at once and the job stops; unfinished tasks stay in tasks/pending and are picked up again the next night.
# Runs inside the prebuilt image (see Dockerfile / build-image.yml): nothing is installed at night.
on:
  schedule:
    # GitHub documents the worst cron delays at the top of every hour, so these use odd minutes.
    # Three attempts (00:07 / 01:23 / 02:41 ICT); the first real run wins, later ones stand down.
    # This lowers the odds of a lost night, it cannot guarantee a start time.
    - cron: "7 17 * * *"
    - cron: "23 18 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:

concurrency:
  group: night-job
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/huybq002/video-resources-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      packages: read
      id-token: write
    env:
      SKILL: .claude/skills/code2video-resource-generator
      STUDIO_DATA_DIR: ${{ github.workspace }}/out/.studio-data
      # let Claude's single long render command run for hours
      BASH_MAX_TIMEOUT_MS: "21000000"
      BASH_DEFAULT_TIMEOUT_MS: "21000000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for tasks
        id: check
        run: |
          count=0
          shopt -s nullglob
          for f in tasks/pending/*.md; do
            name=$(basename "$f")
            # skip tasks already finished on the night branch but not yet merged
            if git cat-file -e "origin/night:tasks/done/$name" 2>/dev/null; then continue; fi
            count=$((count+1))
          done
          echo "Runnable tasks: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "TASK_COUNT=$count" >> "$GITHUB_ENV"
        shell: bash
      - name: Already handled tonight?
        id: guard
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The cron fires three times (17, 18, 19 UTC) so one late start cannot lose the night.
          # Only the first real run may build; any later one sees it here and stands down.
          start=$(date -u -d "$(date -u +%F) 16:00:00" +%s)
          n=0
          while read -r id created status concl; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            t=$(date -u -d "$created" +%s)
            [ "$t" -lt "$start" ] && continue
            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$concl" = "success" ]; then n=$((n+1)); fi
          done < <(gh run list --workflow night-job.yml --repo "$GITHUB_REPOSITORY" --limit 20                      --json databaseId,createdAt,status,conclusion -q '.[] | "\(.databaseId) \(.createdAt) \(.status) \(.conclusion)"')
          echo "other runs this night: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Test dependencies for the improvement phase
        run: pip install --quiet pytest
      - name: Deadline (05:45 Asia/Ho_Chi_Minh = 22:45 UTC, job ends by 06:00)
        id: deadline
        shell: bash
        run: |
          now=$(date -u +%s); h=$(date -u +%H)
          if [ "$h" -ge 17 ] && [ "$h" -lt 23 ]; then
            end=$(date -u -d "$(date -u +%F) 22:45:00" +%s)       # inside the night window: stop Claude at 05:45 ICT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            end=$now                                              # scheduled run that started too late: do nothing
          else
            end=$((now + 300*60))                                 # manual run outside the window: 5 h
          fi
          mins=$(( (end - now) / 60 ))
          [ "$mins" -lt 0 ] && mins=0
          # too little time for a render: skip Claude (task stays pending for the next run)
          [ "$mins" -lt 90 ] && mins=0
          echo "minutes=$mins" >> "$GITHUB_OUTPUT"
          echo "DEADLINE_EPOCH=$end" >> "$GITHUB_ENV"
          echo "Minutes until deadline: $mins (deadline $(date -u -d @$end +%FT%TZ))"
      - name: Restore unfinished work (bundles, voice-over)
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/*/landscape
            outputs/*/portrait
            outputs/*/project
          key: bundle-${{ github.run_id }}
          restore-keys: bundle-
      - name: Run Claude
        if: steps.deadline.outputs.minutes != '0' && steps.guard.outputs.skip != 'true'
        timeout-minutes: ${{ fromJSON(steps.deadline.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow tasks/README.md.
            1. Switch to branch `night`: continue it if origin/night exists, else create it from main.
               Then merge origin/main into it so new tasks appear.
            1b. POLICY FIRST, before any idea exists. Read data/platform-policy.md and channel.json
               (topics[].hard_rules and avoid). If the policy file's "Last refreshed" is older than
               research.policy_refresh_days, use WebSearch to re-check YouTube Community Guidelines and
               monetization policy, and TikTok Community Guidelines, for: AI/synthetic content labelling,
               inauthentic or mass-produced content, crime and violent content, and money or health advice.
               Update data/platform-policy.md with the date and anything that changed, and commit it.
               Everything after this obeys that file; when a source is unclear, take the safer reading.
            2. If tasks/pending/ has no runnable task (TASK_COUNT=$TASK_COUNT), FIND THE NEXT VIDEO YOURSELF.
               Nobody hands you ideas: research the market, pick one, write the task, then build it in this same run.
               a. Read channel.json (niche, audience, seed keywords, formats, what to avoid) and data/ideas.md
                  (what has already been made, queued or dropped: never propose any of those again).
               b. `python scripts/research_youtube.py --update-channel` (about 5-10 min). It asks YouTube itself
                  through yt-dlp what ranks for every keyword of every topic in channel.json, writes
                  data/research/latest.md (demand, competition, Shorts share, winning titles, recurring words per
                  topic) and appends the new keywords it found into data/discovered_keywords.json (not channel.json, so
                  your edits to channel.json and the job's never conflict), which widens the search next night.
                  Read only latest.md, not the JSON. Commit data/discovered_keywords.json and data/research/.
                  If it exits non-zero (YouTube refused), fall back to WebSearch for the topics and say so in the notes.
               c. Use the claude-youtube skill (sub-skills/ideate.md, then seo.md) to turn the digest into
                  `research.ideas_per_run` ideas scored on demand, how crowded the keyword is, and fit with the topic.
                  Prefer a keyword where the views are spread over many channels, not held by two big ones.
                  Respect topics[].share over time: look at data/ideas.md and pick from the topic that is behind.
                  Append every idea to the table in data/ideas.md with status `new` and its topic id.
               d. SCREEN the ideas against step 1b before choosing. Drop (status `dropped`, with the reason) any idea
                  that needs a real person, a real company or a real case, promises money or health outcomes, or
                  depends on graphic detail. For the `mystery` topic the story is ALWAYS invented: take the shape of
                  a real kind of case, then invent names, places, dates and outcome, and never claim it is true.
               e. Take the best surviving idea, write tasks/pending/<NNN>-<slug>.md from templates/video-task-template.md
                  (next free number; idea, lang and duration_min from channel.json; topic id and target keyword in the
                  task), run `python scripts/policy_check.py task tasks/pending/<file>` and fix anything it reports.
                  Set that idea's row to `queued`. Then carry on at step 3 and make the video.
            3. Take files in tasks/pending/ in filename order and do each task.
               Skip any task whose file already exists in tasks/done/ on the night branch.
            4. Save results in outputs/<task id>/. Update "Progress notes" as you go.
            5. Task types (frontmatter `type:`):
               - `video`: use the code2video-resource-generator skill (its SKILL.md; skill dir is $SKILL).
                 Read idea, lang, duration_min, script_prompt, series, episode, renderer, privacy, upload from the task.
                 Every task builds BOTH frame shapes. Everything lives under outputs/<id>/.
                 1. Write specs/<id>.json (duration_s = duration_min*60 exactly; scenes[].target_s must add up to it).
                    Follow the skill's six rules: a hook that lands in the first 30 s, words per scene = target_s * 2.4,
                    its own settings written with scene-dsl (not only `lib:`), supporting cast and `crowd` for groups,
                    2-3 shots per long scene, male characters with bare stick legs. Set `aspect` to "16:9" in the spec;
                    build_both.py overrides it per cut. If series is set, first run
                    `python $SKILL/scripts/series.py brief series/<series>/series-bible.json` and continue that story.
                 2. Generate both cuts:
                    `python $SKILL/scripts/build_both.py specs/<id>.json outputs/<id> [--series series/<series>/series-bible.json]`
                    It writes outputs/<id>/landscape (16:9) and outputs/<id>/portrait (9:16), each with its own
                    three.js backgrounds and framing. Fix every WARNING (edit the spec) and re-run until none is left.
                 2b. `python scripts/policy_check.py spec specs/<id>.json`. It fails on a claim that the story is
                    true, a real organisation or company, graphic injury detail, or advice. Fix the spec and re-run
                    step 2 until it prints "policy OK"; never render a spec that fails.
                 3. Verify both bundles:
                    `python scripts/verify_bundle.py bundle outputs/<id>/landscape --spec specs/<id>.json --expect-minutes <duration_min> --aspect 16:9`
                    `python scripts/verify_bundle.py bundle outputs/<id>/portrait  --spec specs/<id>.json --expect-minutes <duration_min> --aspect 9:16`
                    If either prints PROBLEMS, fix the spec and go back to step 2. Never render a bundle that fails.
                 4. Voice-over once, then render both. script.srt is identical in the two cuts, so:
                    * `renderer: tool` (default, best quality: VieNeu voice, Whisper alignment, HyperFrames):
                      a. job file outputs/<id>/job-landscape.json:
                         {"engine":"hyperframes","project":"outputs/<id>/landscape","language":"<lang>","fps":30}
                         then `code2video-job outputs/<id>/job-landscape.json --report outputs/<id>/report-landscape.json`
                      b. copy the voice-over made for the landscape cut into the portrait cut:
                         `cp outputs/<id>/landscape/voiceover.wav outputs/<id>/landscape/timeline.json outputs/<id>/portrait/`
                      c. job file outputs/<id>/job-portrait.json, the same as the landscape one but with
                         "project":"outputs/<id>/portrait" and **"reuseVoiceover":true**. That flag makes the tool use the
                         copied voiceover.wav instead of synthesising the whole voice again (the slowest step on a CPU);
                         without it the voice is generated a second time. Then
                         `code2video-job outputs/<id>/job-portrait.json --report outputs/<id>/report-portrait.json`
                      The videos are outputs/<id>/<cut>/output.mp4. On failure read the report, fix, re-run.
                    * `renderer: skill` (fallback, edge-tts): run `python $SKILL/ci/run_pipeline.py specs/<id>.json outputs/<id>/landscape --aspect 16:9`
                      and again with `--aspect 9:16 --no-series-update` into outputs/<id>/portrait (video: final.mp4).
                 5. Verify both videos (length, audio present and not silent, frame size):
                    `python scripts/verify_bundle.py video outputs/<id>/landscape/output.mp4 --spec specs/<id>.json --expect-minutes <duration_min> --aspect 16:9`
                    `python scripts/verify_bundle.py video outputs/<id>/portrait/output.mp4  --spec specs/<id>.json --expect-minutes <duration_min> --aspect 9:16`
                    If either prints PROBLEMS (silent or short video), find the cause, fix and re-render. Never publish a video that fails.
                 6. Metadata: `python $SKILL/ci/make_metadata.py specs/<id>.json outputs/<id>/landscape --privacy <privacy> > outputs/<id>/metadata.json`.
                    Thumbnails with the html-thumbnail skill into outputs/<id>/thumbnails/: 1280x720 for the landscape cut
                    and 720x1280 for the portrait one.
                 7. Upload to YouTube ONLY if the task says `upload: true`: landscape first, then portrait
                    (`python $SKILL/ci/upload_youtube.py --video <mp4> --meta outputs/<id>/metadata.json --thumb <image> --confirm`).
                    Never add `--allow-public` unless the task says `privacy: public`. Note in Progress notes that a vertical
                    cut longer than 3 minutes is not eligible as a Short.
                 7b. Publishing pack (this is what you are really making: the user posts by hand).
                    Using the claude-youtube skill (sub-skills/seo.md and metadata.md) and the keyword from the task,
                    write outputs/<id>/publish/publish.json with, for each platform, what to paste:
                      youtube: title (<=100 chars, keyword early, curiosity or concrete promise), description
                        (2-line hook, summary, the chapter list from metadata.json, 3 hashtags), tags, hashtags
                      youtube_shorts: title <=40 chars, short description, 3-5 hashtags
                      tiktok: caption (hook in the first line, <=2200 chars), 3-5 hashtags
                      plus thumbnail_text (3-4 words), pinned_comment (the question from the last scene), posting_notes
                    Put channel.json publish.ai_disclosure into every description and caption: both YouTube and
                    TikTok expect a synthetic voice-over to be labelled, and the label does not reduce reach.
                    Then `python scripts/make_publish_pack.py <id> --spec specs/<id>.json` (platform limits) and
                    `python scripts/policy_check.py publish outputs/<id>/publish/publish.json` (truth claims, real
                    entities, advice, missing disclosure). Fix and re-run until both print OK.
                    In Progress notes, remind the owner to switch on YouTube Studio's "altered or synthetic content"
                    setting and TikTok's "AI-generated" label at upload: the files cannot do that part.
                 8. Publish: `python scripts/publish_release.py <id> --spec specs/<id>.json`
                    It attaches landscape.mp4 + landscape-bundle.zip, portrait.mp4 + portrait-bundle.zip, thumbnails and
                    metadata to a GitHub Release and writes outputs/<id>/manifest.json. Never mark the task done without
                    a release URL in the manifest.
                 9. Commit only small files: `git add outputs/<id>/manifest.json outputs/<id>/publish outputs/<id>/thumbnails outputs/<id>/report-*.json outputs/<id>/metadata.json specs/<id>.json series/ tasks/ data/`.
                    Bundles, videos and wav files are git-ignored on purpose (they live in the Release).
               - `thumbnail` or no type: use the html-thumbnail skill.
            6. When a task is finished, set status: done and move it to tasks/done/, and set its row in
               data/ideas.md to `done` with the release URL.
            7. Commit and `git push origin night` after every task and after every major step,
               so nothing is lost if the usage limit hits.
            8. Never push to main. Never print secrets.
            9. Hard stop at 05:45 Vietnam time (the job itself ends at 06:00): the epoch is in $DEADLINE_EPOCH (compare with `date +%s`). Before starting a task or a render,
               check the time left. A render needs about 7 s per video second (x1.3 margin) plus TTS and checks; if it cannot finish
               before the deadline, do not start it: write the state in Progress notes, commit, push and stop.
            10. If you get a usage-limit or rate-limit error, or less than 15 minutes remain: STOP immediately. Do not retry. First commit and push
               what you have (spec, Progress notes with exactly where you stopped, status: in-progress) and leave the task in tasks/pending/.
               The next night's run picks it up and continues from your notes.
            11. When no task is left, go to step 12 instead of stopping.
            12. IMPROVEMENT PHASE. If at least 25 minutes remain before $DEADLINE_EPOCH, do not stop: spend what is left
               making tomorrow's videos better. Stop it the moment time or usage runs out (step 10 applies).
               FIRST create reports/<YYYY-MM-DD>.md from reports/README.md and commit + push it to `night` at once;
               then append to it after EVERY finished item and push again. A usage limit can end the run at any
               moment and this file is what the owner reads in the morning, so it must never be written only at the end.
               a. MARKET AND SCRIPT (cheap, do this first)
                  - Find what the winning videos of the three topics have in common (titles, length, first line, structure)
                    from data/research/latest.md and WebSearch; compare it with tonight's spec and the earlier ones in specs/.
                  - Re-read tonight's spec as a bored viewer: name its 3 weakest moments and why.
                  - Write concrete, dated, evidenced findings into data/learnings.md.
                  - Change the writing guidance ONLY where the evidence supports it: references/script-planning.md,
                    references/youtube-craft.md, and spec_lint.py rules in the code2video-resource-generator skill.
               b. PIPELINE: tools/code2video, the flow (scripts/, ci/), asset creation (settings, characters, props) and script
                  generation. Only after (a), and only with time for it. Rules:
                  - Work on a branch cut from main: `git switch -c improve/<YYYY-MM-DD> origin/main`. Never commit this to
                    `night` or `main`, and never merge anything yourself.
                  - One small improvement at a time, each with a measurable before and after (a lint count, a test, a render
                    time, a rendered frame). No big rewrites. Revert whatever you cannot show is better.
                  - Before every commit: `python -m py_compile` on touched scripts; `python -m pytest tools/code2video -q`
                    if the tool was touched; `python $SKILL/scripts/build_both.py $SKILL/examples/zombie-portrait/spec.json /tmp/smoke --check`
                    must still end with contract OK for both cuts; `python scripts/policy_check.py` must still pass.
                  - Edit only: .claude/skills/, tools/code2video/, scripts/, templates/, data/learnings.md, reports/.
                    Never .github/, secrets, channel.json, or the rules of data/platform-policy.md.
                  - Never weaken scripts/policy_check.py, scripts/verify_bundle.py or any lint rule that guards a platform
                    policy. You may add checks.
                  - Look at what you change: for an asset, character or setting, render a snapshot (`npx hyperframes snapshot`)
                    and describe what you see in the report. Say plainly when you could not verify something.
                  - When done, or at the limit: commit, `git push origin improve/<YYYY-MM-DD>`, then try
                    `gh pr create --base main --head improve/<YYYY-MM-DD> --title "<what improved>" --body-file reports/<YYYY-MM-DD>.md`.
                    If that fails (Actions may not be allowed to open pull requests), put
                    https://github.com/huybq002/video-resources/compare/main...improve/<YYYY-MM-DD>?expand=1 at the top of the
                    report. Then `git switch night`, and push the final report.
               c. THE REPORT (reports/<YYYY-MM-DD>.md) says: tonight's video(s) with the Release link; what the research
                  found; every improvement (what, why, evidence, files, commit); what you tried and reverted; what you could
                  NOT verify; decisions the owner has to make; suggested next steps. Honest beats impressive.
          claude_args: --max-turns 500 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
      - name: Save unfinished work (bundles, voice-over)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/*/landscape
            outputs/*/portrait
            outputs/*/project
          key: bundle-${{ github.run_id }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            outputs/*/report-*.json
            outputs/*/manifest.json
            outputs/*/publish/*.md
            outputs/*/*_pipeline.log
