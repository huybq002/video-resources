name: Night job

# 00:00 Asia/Ho_Chi_Minh (UTC+7) = 17:00 UTC. Runs once per night.
# Job is capped at 300 min (one 5h usage window), so it ends by ~05:00,
# well inside the 00:00-07:00 allowed range.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: night-job
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Chromium for thumbnails
        run: playwright install --with-deps chromium
      - name: Check for tasks
        id: check
        run: |
          count=0
          shopt -s nullglob
          for f in tasks/pending/*.md; do
            name=$(basename "$f")
            # skip tasks already finished on the night branch but not yet merged
            if git cat-file -e "origin/night:tasks/done/$name" 2>/dev/null; then continue; fi
            count=$((count+1))
          done
          echo "Runnable tasks: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Run Claude
        if: steps.check.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow tasks/README.md.
            1. Switch to branch `night`: continue it if origin/night exists, else create it from main.
               Then merge origin/main into it so new tasks appear.
            2. Take files in tasks/pending/ in filename order and do each task.
               Skip any task whose file already exists in tasks/done/ on the night branch.
            3. Save results in outputs/<task id>/. Update "Progress notes" as you go.
            4. When a task is finished, set status: done and move it to tasks/done/.
            5. Commit and `git push origin night` after every task and after every major step,
               so nothing is lost if the usage limit hits.
            6. Never push to main. Keep going until no tasks remain or you hit the usage limit.
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
