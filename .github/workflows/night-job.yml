name: Night job

# 00:00 Asia/Ho_Chi_Minh (UTC+7) = 17:00 UTC. Runs once per night.
# Job is capped at 300 min (one 5h usage window), so it ends by ~05:00,
# well inside the 00:00-07:00 allowed range.
# Runs inside the prebuilt image (see Dockerfile / build-image.yml): nothing is installed at night.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: night-job
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/huybq002/video-resources-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
      id-token: write
    env:
      SKILL: .claude/skills/code2video-resource-generator
      STUDIO_DATA_DIR: ${{ github.workspace }}/out/.studio-data
      # let Claude's single long render command run for hours
      BASH_MAX_TIMEOUT_MS: "21000000"
      BASH_DEFAULT_TIMEOUT_MS: "21000000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for tasks
        id: check
        run: |
          count=0
          shopt -s nullglob
          for f in tasks/pending/*.md; do
            name=$(basename "$f")
            # skip tasks already finished on the night branch but not yet merged
            if git cat-file -e "origin/night:tasks/done/$name" 2>/dev/null; then continue; fi
            count=$((count+1))
          done
          echo "Runnable tasks: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Run Claude
        if: steps.check.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow tasks/README.md.
            1. Switch to branch `night`: continue it if origin/night exists, else create it from main.
               Then merge origin/main into it so new tasks appear.
            2. Take files in tasks/pending/ in filename order and do each task.
               Skip any task whose file already exists in tasks/done/ on the night branch.
            3. Save results in outputs/<task id>/. Update "Progress notes" as you go.
            4. Task types (frontmatter `type:`):
               - `video`: use the code2video-resource-generator skill in CI mode (its SKILL.md, section "CI mode"; skill dir is $SKILL).
                 Read idea, lang, aspect, duration_min, script_prompt, series, episode, renderer, privacy, upload from the task.
                 Write specs/<task id>.json (duration_s = duration_min*60 exactly; scenes[].target_s must add up to it).
                 If series is set, first run `python $SKILL/scripts/series.py brief series/<series>/series-bible.json` and continue that story.
                 Then render with the task's `renderer` (default `tool`):
                 * `tool` (best voice and video quality: VieNeu voice, Whisper alignment, HyperFrames render):
                   a. `python $SKILL/ci/run_pipeline.py specs/<task id>.json out/<task id>/project --stop-after generate [--series series/<series>/series-bible.json]`
                   b. Write out/<task id>/job.json: {"engine":"hyperframes","project":"out/<task id>/project","language":"<lang>","fps":30}
                      (add "speakers" only if the task names voices; otherwise the default voice is used).
                   c. Run ONE foreground command: `code2video-job out/<task id>/job.json --report out/<task id>/report.json`
                      and read the report for the video path. Fix errors in the project files and re-run if it fails.
                   d. Make metadata: `python $SKILL/ci/make_metadata.py specs/<task id>.json out/<task id>/project --privacy <privacy> > out/<task id>_metadata.json`.
                      Make a thumbnail with the html-thumbnail skill.
                 * `skill` (fallback, edge-tts voice): ONE foreground command
                   `python $SKILL/ci/run_pipeline.py specs/<task id>.json out/<task id>/project [--series series/<series>/series-bible.json]`
                 Upload to YouTube ONLY if the task says `upload: true`: with `skill` add `--upload --privacy <privacy>` to run_pipeline;
                 with `tool` run `python $SKILL/ci/upload_youtube.py --video <mp4> --meta out/<task id>_metadata.json --thumb <jpg or png> --confirm`.
                 Never add `--allow-public` unless the task says `privacy: public`.
                 If a script-length WARNING appears, edit the spec and run again (idempotent).
                 `out/` is git-ignored: do NOT commit videos. Commit specs/ and series/. The workflow uploads the videos and logs as an artifact.
               - `thumbnail` or no type: use the html-thumbnail skill.
            5. When a task is finished, set status: done and move it to tasks/done/.
            6. Commit and `git push origin night` after every task and after every major step,
               so nothing is lost if the usage limit hits.
            7. Never push to main. Never print secrets. Keep going until no tasks remain or you hit the usage limit.
          claude_args: --max-turns 300 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            out/*/project/final.mp4
            out/*/project/output.mp4
            out/*/project/script.srt
            out/*/project/thumb.jpg
            out/*/report.json
            out/*_metadata.json
            out/*/project_pipeline.log
            outputs/
