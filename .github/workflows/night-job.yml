name: Night job

# Works 00:00-06:00 Asia/Ho_Chi_Minh (UTC+7) = 17:00-23:00 UTC, once per night.
# GitHub starts scheduled runs late: measured 3h16m to 4h56m on this repo (2026-11-06/07), so the crons fire EARLY;
# whichever starts first between 14:30 and 17:00 UTC waits inside the job until 00:00 ICT, then works.
# A run that fires before 14:30 UTC (too early to wait inside the 6 h job limit) stands down and leaves the night to a later cron.
# The Claude step stops at 05:45 ICT (22:45 UTC) or 350 min after the job started, whichever is first.
# If Claude runs out of usage (rate limit) the step ends at once; unfinished tasks are picked up next night.
# Runs inside the prebuilt image (see Dockerfile / build-image.yml): nothing is installed at night.
# 2026-11-09: GitHub started the three crons 8.5-9.7 h late (22:58-23:47 UTC), all after the 22:45 deadline, so the
# whole night was lost. More crons, spread from 16:17 to 00:17 ICT, so that whichever one GitHub starts inside the
# window takes the night. A cron that fires on time before 14:30 UTC stands down in ~2 min (see "Wait" step); the
# "Already handled tonight?" guard keeps only one run working. If every cron is late, start it by hand (Run workflow).
on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
    - cron: "17 15 * * *"
    - cron: "17 16 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

concurrency:
  group: night-job
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/huybq002/video-resources-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      packages: read
      id-token: write
    env:
      SKILL: .claude/skills/hezb-story
      # the film engine (owner decision 2026-11-17): hezb-motion in motion/, rendered by the image's Chrome with software GL
      CHROMIUM_PATH: /usr/local/bin/chrome-nosandbox
      MOTION_SIZE: "1280x720"
      MOTION_FPS: "24"
      MOTION_WORKERS: "3"
      MOTION_WHISPER: small
      STUDIO_DATA_DIR: ${{ github.workspace }}/out/.studio-data
      # let Claude's single long render command run for hours
      BASH_MAX_TIMEOUT_MS: "21000000"
      BASH_DEFAULT_TIMEOUT_MS: "21000000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job start
        run: echo "JOB_START=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Check for tasks
        id: check
        run: |
          count=0
          shopt -s nullglob
          for f in tasks/pending/*.md; do
            name=$(basename "$f")
            # skip tasks already finished on the night branch but not yet merged
            if git cat-file -e "origin/night:tasks/done/$name" 2>/dev/null; then continue; fi
            count=$((count+1))
          done
          # tasks written on an earlier night live on the night branch until the owner merges it: they count too, or
          # the job would research and write two MORE tasks on top of the two already waiting there
          for f in $(git ls-tree --name-only origin/night tasks/pending/ 2>/dev/null | grep '\.md$'); do
            name=$(basename "$f")
            [ -e "tasks/pending/$name" ] && continue
            if git cat-file -e "origin/night:tasks/done/$name" 2>/dev/null; then continue; fi
            count=$((count+1))
          done
          echo "Runnable tasks: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "TASK_COUNT=$count" >> "$GITHUB_ENV"
        shell: bash
      - name: Already handled tonight?
        id: guard
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nine crons fire each day. Only one run may work the night: a run that is still going
          # (it may be waiting for 00:00) or one whose Claude step succeeded blocks this one. Runs that
          # stood down (too early, too late, or failed) do not, so a later cron can still take the night.
          if [ "$(date -u +%H)" -lt 12 ]; then start=$(date -u -d "$(date -u -d yesterday +%F) 12:00:00" +%s)
          else start=$(date -u -d "$(date -u +%F) 12:00:00" +%s); fi
          gh run list --workflow night-job.yml --repo "$GITHUB_REPOSITORY" --limit 20             --json databaseId,createdAt,status > /tmp/runs.json
          n=0
          for row in $(python3 -c "import json; [print(f\"{r['databaseId']},{r['createdAt']},{r['status']}\") for r in json.load(open('/tmp/runs.json'))]"); do
            IFS=, read -r id created status <<< "$row"
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            t=$(date -u -d "$created" +%s); [ "$t" -lt "$start" ] && continue
            if [ "$status" != "completed" ]; then n=$((n+1)); echo "run $id is $status"; continue; fi
            did=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs                   -q '[.jobs[].steps[] | select(.name=="Run Claude") | .conclusion] | first // "none"')
            echo "run $id: Claude step $did (a finished run blocks only if the night is complete, checked below)"
          done
          echo "runs that own this night: $n"
          # THREE-VIDEO RULE (owner, 2026-11-15, highest priority): the night is finished only when its three videos exist:
          # >= channel.json night.videos_per_night Releases created since the night started (demo Releases do not count), or a
          # demo Release (demo mode: nothing else is made). A run that ended with fewer (usage limit, deadline, crash) does NOT
          # own the night: the next cron takes over and continues from tasks/pending and the Progress notes.
          need=$(python3 -c "import json; print(json.load(open('channel.json'))['night']['videos_per_night'])")
          start_iso=$(date -u -d @"$start" +%FT%TZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName,createdAt > /tmp/rels.json
          real=$(python3 -c "import json; r=json.load(open('/tmp/rels.json')); print(sum(1 for x in r if x['createdAt']>='$start_iso' and not x['tagName'].startswith('demo-')))")
          demo=$(python3 -c "import json; r=json.load(open('/tmp/rels.json')); print(sum(1 for x in r if x['createdAt']>='$start_iso' and x['tagName'].startswith('demo-')))")
          echo "videos released tonight: $real of $need; demo releases tonight: $demo"
          echo "released=$real" >> "$GITHUB_OUTPUT"
          if [ "$real" -ge "$need" ] || [ "$demo" -gt 0 ]; then echo "night complete ($real videos, $demo demo): nothing more to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$n" -gt 0 ]; then echo "a run is still working on it"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Wait for 00:00 Vietnam time
        id: wait
        if: github.event_name == 'schedule' && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          now=$(date -u +%s); t17=$(date -u -d "$(date -u +%F) 17:00:00" +%s)
          if [ "$(date -u +%H)" -lt 5 ] || [ "$(date -u +%H)" -ge 23 ]; then
            echo "after midnight UTC: tonight's window has passed, catch-up run"; echo "early=false" >> "$GITHUB_OUTPUT"
          elif [ "$now" -ge "$t17" ]; then
            echo "already past 00:00 ICT"; echo "early=false" >> "$GITHUB_OUTPUT"
          elif [ "$now" -lt $((t17 - 150*60)) ]; then
            echo "fired $(( (t17 - now) / 60 )) min before 00:00 ICT: too early to wait inside the 6 h job limit."
            echo "Standing down; a later cron takes the night."
            echo "early=true" >> "$GITHUB_OUTPUT"
          else
            echo "waiting $(( (t17 - now) / 60 )) min for 00:00 ICT"; sleep $((t17 - now))
            echo "early=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test dependencies for the improvement phase
        run: pip install --quiet pytest
      - name: Deadline (05:45 Asia/Ho_Chi_Minh = 22:45 UTC, job ends by 06:00)
        id: deadline
        shell: bash
        run: |
          now=$(date -u +%s); h=$(date -u +%H)
          if [ "$h" -ge 17 ] && [ "$h" -lt 23 ]; then
            end=$(date -u -d "$(date -u +%F) 22:45:00" +%s)       # inside the night window: stop Claude at 05:45 ICT
          elif [ "${{ github.event_name }}" = "schedule" ] && { [ "$h" -ge 23 ] || [ "$h" -lt 5 ]; }; then
            # GitHub started every cron late (2026-11-09: all three after 22:45 UTC, the night was lost). The guard
            # above already made sure no other run owns this night: catch up now with a 5 h budget rather than
            # making nothing; the videos land in the morning instead of before 06:00.
            end=$((now + 300*60)); echo "CATCH-UP run: started after the window, making the night's videos now"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            end=$now                                              # scheduled run started far too late (after 12:00 ICT): do nothing
          else
            end=$((now + 300*60))                                 # manual run outside the window: 5 h
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" -eq 22 ] && [ $((end - now)) -lt $((90*60)) ]; then
            end=$((now + 300*60)); echo "CATCH-UP run: started at the very end of the window"
          fi
          cap=$(( ${JOB_START:-$now} + 350*60 ))                # the job is killed at 360 min: leave 10 for saving
          [ "$end" -gt "$cap" ] && end=$cap
          mins=$(( (end - now) / 60 ))
          [ "$mins" -lt 0 ] && mins=0
          # too little time for a render: skip Claude (task stays pending for the next run)
          [ "$mins" -lt 90 ] && mins=0
          echo "minutes=$mins" >> "$GITHUB_OUTPUT"
          echo "DEADLINE_EPOCH=$end" >> "$GITHUB_ENV"
          echo "Minutes until deadline: $mins (deadline $(date -u -d @$end +%FT%TZ))"
      - name: Approval gate (per visual style, owner decision 2026-11-15)
        shell: bash
        run: |
          bash scripts/stickman/install.sh    # no-op when the image already has the pinned runtime
          now_hash=$(python3 scripts/skill_hash.py)
          enabled=$(python3 -c "import json; print(','.join(json.load(open('stickman/lock.json'))['enabled_styles']))")
          approved=$(python3 -c "import json; a=json.load(open('data/approval.json')).get('styles',{}); print(','.join(k for k,v in a.items() if v.get('approved') and v.get('skill_hash')=='$now_hash'))" 2>/dev/null || echo "")
          echo "SKILL_HASH=$now_hash" >> "$GITHUB_ENV"
          echo "ENABLED_STYLES=$enabled" >> "$GITHUB_ENV"
          echo "APPROVED_STYLES=$approved" >> "$GITHUB_ENV"
          if [ -n "$approved" ]; then echo "APPROVED=true" >> "$GITHUB_ENV"; else echo "APPROVED=false" >> "$GITHUB_ENV"; fi
          echo "Look $now_hash. Enabled styles: $enabled. Approved styles: ${approved:-none} (the others make demos)."
      - name: Restore unfinished work (bundles, voice-over)
        if: steps.deadline.outputs.minutes != '0' && steps.guard.outputs.skip != 'true' && steps.wait.outputs.early != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/*/landscape
            outputs/*/portrait
            outputs/*/project
          key: bundle-${{ github.run_id }}
          restore-keys: bundle-
      - name: Run Claude
        id: claude
        if: steps.deadline.outputs.minutes != '0' && steps.guard.outputs.skip != 'true' && steps.wait.outputs.early != 'true'
        timeout-minutes: ${{ fromJSON(steps.deadline.outputs.minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow tasks/README.md.
            RULE 0 - THE THREE-VIDEO RULE (HIGHEST PRIORITY, overrides every rule below that says stop, skip, wait or go on to the
            improvement phase; owner, 2026-11-15). You may stop ONLY when channel.json night.videos_per_night (3) videos are
            published tonight, one per lane, each with a Release URL in its manifest (releases created since 12:00 UTC of tonight's
            date; `gh release list` shows them; demo Releases do not count unless tonight is demo mode). Until then:
            - never start the improvement phase (step 12), never write a final report as "done", never end the run;
            - never drop a lane: when time is short SHORTEN the videos (news 2 min, mystery 4 min, trending 2 min, down to 1 min each
              if that is what fits; the lane's duration range may be undercut for this) and re-run `plan_night.py budget`, but make all three;
            - when a video fails verification, fix it and re-render: do not skip it; when a lane has no safe story (news), replace it
              with a second trending video, which still counts;
            - publish each video the moment it is verified, in the order news, mystery, trending, so a hard stop leaves finished videos;
            - the only reasons to stop earlier are limits you cannot move: the deadline epoch in $DEADLINE_EPOCH, a usage or rate
              limit error, or the job's own timeout. Then commit and push the state (Progress notes: which lane is next and how far
              it got). The workflow knows the night is NOT finished, and the next cron run continues exactly there. Say how many of
              the three are done and why you stopped in the report.
            Safety rules are NOT overridden by Rule 0: never publish a video that fails policy_check or verify_bundle, never use an
            unapproved style for a full video, never weaken a lint to finish.
            0b. APPROVAL GATE (per visual style): ENABLED_STYLES=$ENABLED_STYLES, APPROVED_STYLES=$APPROVED_STYLES (look
               fingerprint $SKILL_HASH, data/approval.json). A video may be made in full only in an APPROVED style.
               - Pick each video's style by its content among ENABLED_STYLES ($SKILL/SKILL.md "Styles"), never the previous
                 video's style. Prefer an approved style that fits; if none fits, the video waits and tonight makes a demo.
               - DEMO for every enabled style that is not approved yet (at most 3 tonight): a 20-30 s story of 2 scenes in that
                 style (the hook of a planned idea plus one exchange between two characters), voiced, authored and rendered
                 exactly as step 5 says but with `--seconds` covering the demo, both cuts, verified. Publish all demos in one
                 Release tagged demo-<YYYY-MM-DD>-<run id> (each style's landscape.mp4 / portrait.mp4 named by style, plus the
                 contact sheets). The report starts with "DEMO - waiting for approval", the release link, the fingerprint and,
                 per style, the exact command: `python scripts/approve_demo.py --style <B1|B2|B3> --demo <release url>`
                 then commit and push data/approval.json to main.
               - Full videos only in approved styles. With no approved style at all, tonight is demos only: still do steps 1, 1b
                 and 2 (policy, research, ideas, tasks) and leave the tasks in tasks/pending/ for the first approved night.
            1. Switch to branch `night`: continue it if origin/night exists, else create it from main.
               Then merge origin/main into it so new tasks appear.
            1b. POLICY FIRST, before any idea exists. Read data/platform-policy.md and channel.json
               (topics[].hard_rules and avoid). If the policy file's "Last refreshed" is older than
               research.policy_refresh_days, use WebSearch to re-check YouTube Community Guidelines and
               monetization policy, and TikTok Community Guidelines, for: AI/synthetic content labelling,
               inauthentic or mass-produced content, crime and violent content, and money or health advice.
               Update data/platform-policy.md with the date and anything that changed, and commit it.
               Everything after this obeys that file; when a source is unclear, take the safer reading.
            2. TONIGHT MAKES THREE VIDEOS, ONE PER LANE (channel.json night.lanes, owner decision 2026-11-15): NEWS (2-3 min, rulebook
               data/news-lane.md), MYSTERY (6-8 min, data/mystery-tricks.md + data/mystery-craft.md) and TRENDING (3-4 min, the
               research digest). `python scripts/plan_night.py status` lists the lanes that still have no runnable task
               (tasks carry `lane:`). Write the missing lanes' tasks yourself (TASK_COUNT=$TASK_COUNT waiting), always running the
               research below. For the mystery lane first take the next owner-approved task from tasks/later/ (move it to
               tasks/pending/, `status: pending`) before inventing a new case. Order tonight: news first (it goes stale), then
               mystery, then trending. If no news story passes data/news-lane.md, say so in the report and make a second trending
               video instead: never force a risky story.
               Nobody hands you ideas: research the market, pick them, write the tasks, then build them in this same run.
               Steps b and c (research + at least 3 new ideas, gated by plan_night.py check-ideas) run EVERY night, also when
               TASK_COUNT is already 2 or more (those ideas feed the next nights); steps d and e (screen, write new tasks)
               only to top up to 2 runnable tasks. Tasks already waiting on the night branch count (TASK_COUNT includes them).
               a. Read channel.json (niche, audience, seed keywords, formats, what to avoid) and data/ideas.md
                  (what has already been made, queued or dropped: never propose any of those again).
               b. `python scripts/research_youtube.py --update-channel` (about 15-20 min now: it also reads autocomplete, the newest uploads and channel sizes). It asks YouTube itself
                  through yt-dlp what ranks for every keyword of every topic in channel.json, writes
                  data/research/latest.md (demand, competition, Shorts share, winning titles, recurring words per
                  topic) and appends the new keywords it found into data/discovered_keywords.json (not channel.json, so
                  your edits to channel.json and the job's never conflict), which widens the search next night.
                  Read only latest.md, not the JSON. Commit data/discovered_keywords.json and data/research/.
                  If it exits non-zero (YouTube refused), fall back to WebSearch for the topics and say so in the notes.
                  Then `python scripts/channel_stats.py` (our own videos' public views into data/performance.md; it only
                  prints a note when channel.json has no own_channel) and commit data/performance.md.
               c. READ data/growth-playbook.md FIRST (rules R1-R5: why videos 003-005 got no views and what to do instead).
                  Use the claude-youtube skill (sub-skills/ideate.md, then seo.md) to turn the digest into
                  `research.ideas_per_run` ideas. Rank by the digest's breakouts (small channels winning now), then recent
                  median views, then spread; never by all-time views alone. Each idea's keyword is a phrase from the
                  digest's "What people type" section (2-6 words people type, never a single word), and each idea cell
                  carries "Title: <working title, 40-60 chars> / Thumb: <3 words>"; an idea without a title a stranger
                  would click is dropped. Ideas in a topic or title pattern that beat the channel median in
                  data/performance.md come first; a pattern at the bottom twice is paused.
                  LANES (one idea per lane every night; `plan_night.py check-ideas` fails without one for each):
                  - NEWS: follow data/news-lane.md: WebSearch the day's top stories in the allowed areas, take one reported by 2+
                    independent reputable outlets, put `lane: news`, `topic: news`, `sources:` (URLs with the date read) and
                    `news_date:` in the task, exact numbers, uncertainty said aloud, no real person shown, no advice;
                    `python scripts/policy_check.py task <file>` must pass;
                  - TRENDING: the digest's breakouts, recent demand and 'what people type' (the rules above), topic money or psychology;
                  - MYSTERY (classic fair-play murder mysteries): for every mystery idea
                  1. read data/mystery-tricks.md and data/mystery-craft.md; pick the first `unused` kind of trick that was not used
                     this week (the table is the genre's stock: locked room, alibi, snow, dying message, double ...). It is a
                     KIND of trick, never a story;
                  2. WebSearch (and the digest) for what viewers search and watch about that kind: titles, lengths, wording of
                     "locked room mystery explained", "alibi trick explained", "how the trick worked" ... Use those words in the
                     search phrase and tags. NEVER read a franchise's episode list to copy a case: do not use any existing
                     franchise's names, characters, cases, titles or catch-phrases anywhere (scripts/policy_check.py fails them);
                  3. write a NEW case around the kind: new victim, place, suspects, clues, twist; the death is never shown or
                     described (no blood, wound, weapon on screen, method or cause of death), the trick is a misdirection trick,
                     never a recipe to harm; three fair clues in plain view; the structure of data/mystery-craft.md;
                  4. put the idea in data/ideas.md (keyword = a phrase people type, never a franchise name) and mark the kind
                     `used` in data/mystery-tricks.md with the task id, in the same commit as the task;
                  5. write the task with the idea's duration (6-8 min) and a `style:` picked by content among the approved styles
                     (mysteries: B3 first, then B2, B1), different from the previous video's style.
                  HARD RULE: every run writes AT LEAST 3 new ideas (night.min_ideas_per_run) dated tonight into data/ideas.md,
                  even when tasks are already pending (they feed the next nights). Then run
                  `python scripts/plan_night.py check-ideas`; if it prints FAIL, research more (WebSearch is the fallback
                  when research_youtube.py is refused) until it prints "ideas OK". Never choose videos before that.
                  Prefer a keyword where the views are spread over many channels, not held by two big ones.
                  Within the trending lane alternate money and psychology (look at data/ideas.md and pick the one that is behind).
                  Append every idea to the table in data/ideas.md with status `new` and its topic id.
               d. SCREEN the ideas against step 1b before choosing. Drop (status `dropped`, with the reason) any idea
                  that needs a real person, a real company or a real case, promises money or health outcomes, or
                  depends on graphic detail. For the `mystery` topic the story is ALWAYS invented: take the shape of
                  a real kind of case, then invent names, places, dates and outcome, and never claim it is true.
               e. Take the best surviving idea of EACH LANE (so night.videos_per_night = 3 runnable tasks, one per lane) and write one tasks/pending/<NNN>-<slug>.md each from templates/video-task-template.md
                  (next free numbers; idea and lang from channel.json; topic id and target keyword in the task).
                  LENGTH BY LANE: duration_min inside the lane's duration_min range in channel.json night.lanes (news 2-3, mystery
                  6-8, trending 3-4); never outside night.duration_range_min. Then check the night fits:
                  `python scripts/plan_night.py budget --durations <d1>,<d2>[,...]` (uses $DEADLINE_EPOCH). If it prints
                  FAIL, shorten the later videos to the length it gives (rewrite their duration_min) - never drop below
                  2 videos. Run `python scripts/policy_check.py task tasks/pending/<file>` on each and fix anything it reports.
                  Set those ideas' rows to `queued`. Then carry on at step 3 and make the videos, one after the other.
            3. Take files in tasks/pending/ in filename order and do each task. Finish and publish video 1 completely
               (release URL in the manifest) before starting video 2, so a late usage limit still leaves a finished video.
               Skip any task whose file already exists in tasks/done/ on the night branch.
            4. Save results in outputs/<task id>/. Update "Progress notes" as you go.
            5. Task types (frontmatter `type:`):
               - `video`: follow the hezb-story skill ($SKILL/SKILL.md). The picture is made with OUR film engine hezb-motion
                 (motion/, owner decision 2026-11-17; it replaces the stickman-video-director runtime): PixiJS stage, paper.js
                 and p5.js drawing, OGL grade and GL Transitions, tsParticles weather, Rapier and Matter.js physics, react-spring
                 and anime.js motion, a Tone.js score, faster-whisper word timings. Read motion/README.md and the worked example
                 motion/examples/prodigal-son/direct.py BEFORE directing. Read idea, lang, duration_min, script_prompt, style,
                 privacy, upload from the task. TONIGHT: 16:9 only (outputs/<id>/landscape); the engine has no native portrait cut
                 yet, so set `only_aspect: "16:9"` in the task and say so in the report. Everything lives under outputs/<id>/.
                 1. STORY. Write stories/<id>.json ($SKILL/references/story-schema.md): style (content-picked, approved),
                    cast with a look, scenes whose `place` says where THIS beat happens in THIS story (no preset places),
                    acted lines with `emote`, hook first, a question last. Craft: $SKILL/references/*.md and
                    data/growth-playbook.md H1-H6. Then
                    `python $SKILL/scripts/lint_story.py stories/<id>.json --previous-style <style of the last outputs/*/manifest.json>`
                    and `python scripts/policy_check.py spec stories/<id>.json`; fix until both are clean.
                 2. VOICE. `python scripts/stickman/narrate.py stories/<id>.json outputs/<id>/voice`
                    (edge-tts conversational voices for en, VieNeu for vi; each line acted; natural pauses; never sped up to fit).
                    Then `python motion/align.py outputs/<id>/voice --model small` (word timings; fix any line it reports CHECK).
                 3. DIRECT. Write outputs/<id>/direct.py with motion/director.py and motion/worlds.py, line by line against
                    voice/timing.json and words.json, exactly like the worked example. The owner's rules (2026-11-17), all MUST:
                    - NO MOTION WITHOUT A PURPOSE: a character at rest only breathes; every movement is a VERB the story asks
                      for (walk to, give, take, kneel, run, hug, point, count, eat, drink, cheer, sigh, shout, turnAway ...),
                      timed to its line or its word (f.word(...)). Never a gesture loop.
                    - THE WORLD LIVES AND REACTS: each place has ambient life (birds, smoke, clouds, wind in grass/wheat, rain,
                      passers-by, a crowd, pigs, fire, glow) and particles (dust, rain, leaves, fireflies, confetti); story
                      moments trigger it (birds scatter, a gust, lanterns swing via f.hanger gusts, coins spill via f.spill).
                    - A NEW PICTURE OFTEN: 1-3 shots per line, no shot over ~6 s, vary kinds (wide, medium, close, two, over,
                      detail, track, reveal, insert3d); director.py prints CHECK lines on save: fix every one.
                    - THE OBJECTS THE WORDS NAME are on screen when named (f.prop / f.spill / insert3d), big enough to read.
                    - SOUND: f.sfx at every visible action, f.section per scene mood (motif, bpm, scale, instruments), a
                      silence before the turn, f.hit on the peak.
                    - Style decides the world's light: B2 = warm colourful day; B3 = night/overcast grades (worlds night, rain,
                      street "overcast", look grade "night"/"cool"); B1 = light paper, few colours. Places come from the words:
                      start from a worlds.py place and change its elements for THIS story.
                    - Mysteries: the death is never shown; clues are props drawn large, shown when the narrator names them.
                 4. RENDER: `python motion/make_film.py --voice outputs/<id>/voice --direct outputs/<id>/direct.py --out outputs/<id>/landscape --stills-only`
                    first, LOOK at outputs/<id>/landscape/stills/contact-sheet.png (place right, people visible, action
                    readable, objects on screen?), fix direct.py, then the same command without --stills-only (score, render,
                    mix -> outputs/<id>/landscape/output.mp4). It renders with software GL at 1280x720, 24 fps: budget about
                    10 s of wall time per video second (channel.json night.render_s_per_video_s). A demo: add `--seconds 30`.
                 5. CHECK: `python scripts/verify_bundle.py video outputs/<id>/landscape/output.mp4 --story stories/<id>.json --aspect 16:9`
                    (runs scripts/media/director_pass.py: dead air, frozen picture, black frames, contact sheets; a "flat mix"
                    note alone is not a failure). LOOK at the director_pass sheets: does the picture change and match the
                    words, does every action read? Fix and re-render whatever fails. Never publish a video that fails.
                 6. Metadata: `python scripts/media/make_metadata.py stories/<id>.json outputs/<id>/voice --privacy <privacy> > outputs/<id>/metadata.json`.
                    Thumbnails with the html-thumbnail skill into outputs/<id>/thumbnails/: 1280x720 for the landscape cut
                    and 720x1280 for the portrait one.
                 7. Upload to YouTube ONLY if the task says `upload: true`: landscape first, then portrait
                    (`python scripts/media/upload_youtube.py --video <mp4> --meta outputs/<id>/metadata.json --thumb <image> --confirm`).
                    Never add `--allow-public` unless the task says `privacy: public`. Note in Progress notes that a vertical
                    cut longer than 3 minutes is not eligible as a Short.
                 7b. Publishing pack (this is what you are really making: the user posts by hand).
                    Using the claude-youtube skill (sub-skills/seo.md and metadata.md), the keyword from the task and
                    the packaging rules T1-T4, D1-D4 and S1 of data/growth-playbook.md,
                    write outputs/<id>/publish/publish.json with, for each platform, what to paste:
                      youtube: title (40-60 chars, no genre label in brackets, curiosity gap or concrete outcome),
                        title_options (3 candidates for YouTube Studio's Test & compare), description (600-1500 chars:
                        first 125 chars = hook + search phrase with no "invented/fiction/AI"; then what the viewer will
                        understand, chapters from metadata.json, the comment question; the AI/fiction label and music
                        credit in the LAST block; 3 hashtags), tags (search phrase + 3-5 autocomplete phrases from the
                        digest + broad ones), hashtags
                      youtube_shorts: title <=40 chars, short description, 3-5 hashtags
                      tiktok: caption (hook in the first line, <=2200 chars), 3-5 hashtags
                      plus thumbnail_text (3-4 words), pinned_comment (the question from the last scene), posting_notes
                    Put channel.json publish.ai_disclosure into every description and caption: both YouTube and
                    TikTok expect a synthetic voice-over to be labelled, and the label does not reduce reach.
                    Then `python scripts/make_publish_pack.py <id> --spec stories/<id>.json` (platform limits) and
                    `python scripts/policy_check.py publish outputs/<id>/publish/publish.json` (truth claims, real
                    entities, advice, missing disclosure). Fix and re-run until both print OK.
                    In Progress notes, remind the owner to switch on YouTube Studio's "altered or synthetic content"
                    setting and TikTok's "AI-generated" label at upload: the files cannot do that part.
                 8. Publish: `python scripts/publish_release.py <id> --spec stories/<id>.json`
                    It attaches landscape.mp4 + landscape-bundle.zip, portrait.mp4 + portrait-bundle.zip, thumbnails and
                    metadata to a GitHub Release and writes outputs/<id>/manifest.json. Never mark the task done without
                    a release URL in the manifest.
                 9. Commit only small files: `git add outputs/<id>/manifest.json outputs/<id>/publish outputs/<id>/thumbnails outputs/<id>/metadata.json outputs/<id>/shots-*.json outputs/<id>/voice/timing.json stories/<id>.json tasks/ data/`.
                    Bundles, videos and wav files are git-ignored on purpose (they live in the Release).
               - `thumbnail` or no type: use the html-thumbnail skill.
            6. When a task is finished, set status: done and move it to tasks/done/, and set its row in
               data/ideas.md to `done` with the release URL.
            7. Commit and `git push origin night` after every task and after every major step,
               so nothing is lost if the usage limit hits.
            8. Never push to main. Never print secrets.
            9. Hard stop at 05:45 Vietnam time (the job itself ends at 06:00): the epoch is in $DEADLINE_EPOCH (compare with `date +%s`). Before starting a task or a render,
               check the time left. A render needs about 7 s per video second (x1.3 margin) plus TTS and checks; if it cannot finish
               before the deadline, do not start it: write the state in Progress notes, commit, push and stop.
            10. If you get a usage-limit or rate-limit error, or less than 15 minutes remain: STOP immediately. Do not retry. First commit and push
               what you have (spec, Progress notes with exactly where you stopped, status: in-progress) and leave the task in tasks/pending/.
               The next night's run picks it up and continues from your notes.
            11. When no task is left: if fewer than night.videos_per_night videos were published tonight, RULE 0 applies: go back to
               step 2 and make the missing lane (shortened if needed). Only with all three published, go to step 12.
            12. IMPROVEMENT PHASE (only after Rule 0 is satisfied: three videos published tonight). If at least 25 minutes remain before $DEADLINE_EPOCH, do not stop: spend what is left
               making tomorrow's videos better. Stop it the moment time or usage runs out (step 10 applies).
               FIRST create reports/<YYYY-MM-DD>.md from reports/README.md and commit + push it to `night` at once;
               then append to it after EVERY finished item and push again. A usage limit can end the run at any
               moment and this file is what the owner reads in the morning, so it must never be written only at the end.
               a. MARKET AND SCRIPT (cheap, do this first)
                  - Read data/performance.md first: which of our videos beat the channel median, and what their topic,
                    title pattern, length and first line have in common. Every change to data/growth-playbook.md cites it.
                  - Find what the winning videos of the three topics have in common (titles, length, first line, structure)
                    from data/research/latest.md (breakouts first) and WebSearch; compare it with tonight's story and the earlier ones in stories/.
                  - Re-read tonight's story and watch its contact sheets as a bored viewer: name its 3 weakest moments and why.
                  - Write concrete, dated, evidenced findings into data/learnings.md.
                  - Change the writing guidance ONLY where the evidence supports it: the hezb-story skill's references and
                    scripts/lint_story.py. The film engine is motion/ (hezb-motion): improve it only on an improve/ branch, with a
                    rendered before/after still.
               b. PIPELINE: tools/code2video, the flow (scripts/, ci/), asset creation (settings, characters, props) and script
                  generation. Only after (a), and only with time for it. Rules:
                  - Work on a branch cut from main: `git switch -c improve/<YYYY-MM-DD> origin/main`. Never commit this to
                    `night` or `main`, and never merge anything yourself.
                  - One small improvement at a time, each with a measurable before and after (a lint count, a test, a render
                    time, a rendered frame). No big rewrites. Revert whatever you cannot show is better.
                  - Before every commit: `python -m py_compile` on touched scripts; `python -m pytest tools/code2video -q`
                    if the tool was touched; tonight's story must still build with `python motion/make_film.py ... --stills-only`; `python scripts/policy_check.py` must still pass.
                  - Edit only: .claude/skills/, motion/, tools/code2video/, scripts/, templates/, data/learnings.md, reports/.
                    Never .github/, secrets, channel.json, stickman/lock.json, the rules of data/platform-policy.md, data/approval.json,
                    scripts/skill_hash.py or scripts/approve_demo.py (only the owner approves how videos look).
                  - Never weaken scripts/policy_check.py, scripts/verify_bundle.py or any lint rule that guards a platform
                    policy. You may add checks.
                  - Look at what you change: for an asset, character or setting, render a short preview (`motion/make_film.py ... --seconds 10`)
                    and describe what you see in the report. Say plainly when you could not verify something.
                  - When done, or at the limit: commit, `git push origin improve/<YYYY-MM-DD>`, then try
                    `gh pr create --base main --head improve/<YYYY-MM-DD> --title "<what improved>" --body-file reports/<YYYY-MM-DD>.md`.
                    If that fails (Actions may not be allowed to open pull requests), put
                    https://github.com/huybq002/video-resources/compare/main...improve/<YYYY-MM-DD>?expand=1 at the top of the
                    report. Then `git switch night`, and push the final report.
               c. THE REPORT (reports/<YYYY-MM-DD>.md) says: tonight's video(s) with the Release link; what the research
                  found; every improvement (what, why, evidence, files, commit); what you tried and reverted; what you could
                  NOT verify; decisions the owner has to make; suggested next steps. Honest beats impressive.
          claude_args: --max-turns 500 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
      - name: Night quota (three-video rule)
        if: always() && steps.claude.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%H)" -lt 12 ]; then start=$(date -u -d "$(date -u -d yesterday +%F) 12:00:00" +%s); else start=$(date -u -d "$(date -u +%F) 12:00:00" +%s); fi
          start_iso=$(date -u -d @"$start" +%FT%TZ)
          need=$(python3 -c "import json; print(json.load(open('channel.json'))['night']['videos_per_night'])")
          gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName,createdAt > /tmp/rels.json
          real=$(python3 -c "import json; r=json.load(open('/tmp/rels.json')); print(sum(1 for x in r if x['createdAt']>='$start_iso' and not x['tagName'].startswith('demo-')))")
          msg="Night quota: $real of $need videos released tonight."
          if [ "$real" -lt "$need" ]; then msg="$msg NOT FINISHED: the next cron run continues the night."; fi
          echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Save unfinished work (bundles, voice-over)
        # only after a run that worked: stand-down runs used to save a copy of the same cache each time (9 crons a night)
        if: always() && steps.claude.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/*/landscape
            outputs/*/portrait
            outputs/*/project
          key: bundle-${{ github.run_id }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            outputs/*/report-*.json
            outputs/*/manifest.json
            outputs/*/publish/*.md
            outputs/*/*_pipeline.log
